# Rust workspace for the native core. UI (apps/app) and Node services build with pnpm.
# apps/app/src-tauri is added as a member when the Tauri app is initialised.
[workspace]
resolver = "2"
members = ["crates/*", "apps/app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false

[profile.release]
opt-level = "s"
# LTO disabled: the Tauri `app` crate is BOTH a lib (`app_lib`) and a bin (`app`), and LTO (fat OR
# thin) makes the lib's rlib carry LTO-only data that the bin then fails to read (rustc E0786 on
# 1.97). Disabling LTO trades a little binary size for a build that actually links. Revisit if a
# future toolchain fixes the lib+bin+LTO metadata clash.
lto = false

# Test binaries link the whole Tauri tree; dropping debug info avoids Windows
# LNK1201 (.pdb write/lock contention with AV) and speeds up test builds.
[profile.test]
debug = 0
