# ⚠️ DO NOT `kubectl apply` THIS FILE WHILE `DOWNLOAD_BASE` IS STILL THE PLACEHOLDER.
# The init container fetches the installers from that URL with `curl -f`, so a placeholder value
# makes every new pod fail with Init:Error. (Applied prematurely on 2026-07-23: the rollout stalled
# but the site STAYED UP, because Kubernetes keeps the old pods until a new one is Ready. Recovery
# was `kubectl -n polyglotformfill rollout undo deploy/ppf-site`.)
# Order of operations:
#   1. create the bucket PAR (command below) and paste it into DOWNLOAD_BASE
#   2. .\deploy\k8s\publish-site.ps1 -WithBinaries     # uploads the installer objects
#   3. kubectl apply -f deploy/k8s/site.yaml
#
# PolyglotFormFill marketing site — co-hosted on the existing hospital-nexus OKE cluster.
# Fully isolated in its own namespace; shares the nginx ingress + cert-manager only.
# Stock nginx image + an init container that pulls the site tarball from Oracle Object
# Storage (no custom image, no registry). Update flow: re-upload the tarball, then
# `kubectl -n polyglotformfill rollout restart deploy/ppf-site`.
apiVersion: v1
kind: Namespace
metadata:
  name: polyglotformfill
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ppf-site
  namespace: polyglotformfill
spec:
  replicas: 2
  selector:
    matchLabels: { app: ppf-site }
  template:
    metadata:
      labels: { app: ppf-site }
    spec:
      initContainers:
        - name: fetch-site
          image: docker.io/library/alpine:3.20
          command: ["/bin/sh", "-c"]
          args:
            - >
              apk add --no-cache curl >/dev/null 2>&1 &&
              curl -fsSL "$SITE_URL" -o /tmp/site.tgz &&
              tar -xzf /tmp/site.tgz -C /web &&
              mkdir -p /web/download &&
              for f in $BINARIES; do
                echo "fetching $f" &&
                curl -fsSL "$DOWNLOAD_BASE/$f" -o "/web/download/$f" || exit 1;
              done &&
              echo "extracted:" && ls -la /web /web/download
          env:
            # The site tarball NO LONGER contains the installers — they are separate objects
            # fetched below. This keeps a content-only publish at ~14 MB instead of ~86 MB.
            - name: SITE_URL
              value: "https://objectstorage.us-ashburn-1.oraclecloud.com/p/jCtDSAbfP-E2c8UsCnBa-_pWMhr_-z7fWAK9CBs-bYV83hkH-X8OcTnAG1ronnuS/n/idlqdkwlstnb/b/polyglotformfill-dl/o/ppf-site.tar.gz"
            # Bucket-level read PAR (prefix form, ends at /o). Create with:
            #   oci os preauth-request create --namespace idlqdkwlstnb \
            #     --bucket-name polyglotformfill-dl --name ppf-downloads \
            #     --access-type AnyObjectRead --time-expires 2027-12-31T00:00:00Z
            # then set the value below to  https://objectstorage.us-ashburn-1.oraclecloud.com<accessUri>
            # NOTE: `curl -f` makes a missing/expired PAR fail the init container LOUDLY rather
            # than letting nginx come up serving 404s on every download link.
            - name: DOWNLOAD_BASE
              value: "REPLACE_WITH_BUCKET_PAR_URL"
            # Keep in step with $BINARIES in publish-site.ps1.
            - name: BINARIES
              value: "PolyglotFormFill-Setup.exe polyglotformfill-extension.zip"
          volumeMounts:
            - { name: web, mountPath: /web }
      containers:
        - name: nginx
          image: docker.io/library/nginx:1.27-alpine
          ports: [{ containerPort: 80 }]
          volumeMounts:
            - { name: web, mountPath: /usr/share/nginx/html, readOnly: true }
          resources:
            requests: { cpu: "10m", memory: "16Mi" }
            limits: { cpu: "200m", memory: "128Mi" }
      volumes:
        - name: web
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ppf-site
  namespace: polyglotformfill
spec:
  selector: { app: ppf-site }
  ports:
    - { port: 80, targetPort: 80 }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ppf-site
  namespace: polyglotformfill
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts: [polyglotformfill.mooo.com]
      secretName: ppf-site-tls
  rules:
    - host: polyglotformfill.mooo.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ppf-site
                port: { number: 80 }
