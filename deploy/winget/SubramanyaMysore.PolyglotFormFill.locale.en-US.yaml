ShortDescription: Fill any form in any language, entirely on your own device.
Description: |-
  PolyglotFormFill fills PDF and web forms from a vault of your own details, in whatever language
  the form is written in. It reads scanned and non-English forms with on-device OCR, can show you a
  translated reading view while always saving the form in its original language, and keeps an
  encrypted, versioned history of everything you have filled.

  Everything runs on your device. Your details, the documents you open, and the forms you fill are
  never sent to the publisher or any third party. The only time your data leaves your machine is
  when you yourself submit a completed form to the recipient you chose.
