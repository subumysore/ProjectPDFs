<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PolyglotFormFill — Fill any form, in any language, on your device</title>
<meta property="og:title" content="PolyglotFormFill — Fill any form, in any language, on your device">
<meta property="og:description" content="One-click, private, on-device form autofill with on-device translation. Nothing leaves your device.">
<meta property="og:type" content="video.other">
<meta property="og:video" content="https://polyglotformfill.com/pitch/PolyglotFormFill-pitch.mp4">
<style>
  :root{--indigo:#141a44;--teal:#12b6a5}
  *{margin:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
  body{background:#0b0f26;color:#eef1ff;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;gap:22px}
  h1{font-size:clamp(22px,4vw,34px);font-weight:800;text-align:center;letter-spacing:-.02em}
  h1 .hl{color:var(--teal)}
  .wrap{width:min(960px,100%);border-radius:16px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.55)}
  video{width:100%;display:block;background:#000}
  p.sub{color:#aeb6e0;text-align:center;max-width:640px;line-height:1.5}
  a.cta{display:inline-block;background:var(--teal);color:#06241f;font-weight:700;text-decoration:none;padding:12px 22px;border-radius:10px}
  .row{display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:center}
  .muted{color:#7f88bb;font-size:14px}
</style>
</head>
<body>
  <h1>Fill <span class="hl">any form</span>, in <span class="hl">any language</span> — on your device.</h1>
  <div class="wrap">
    <video src="PolyglotFormFill-pitch.mp4" controls playsinline poster="shots/s1.png"></video>
  </div>
  <p class="sub">One click completes web forms and PDFs from a private, encrypted profile — with on-device translation into your language. Nothing you enter ever leaves your device.</p>
  <div class="row">
    <a class="cta" href="https://polyglotformfill.com/">Get PolyglotFormFill</a>
    <span class="muted">polyglotformfill.com</span>
  </div>
</body>
</html>
