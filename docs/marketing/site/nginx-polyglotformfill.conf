# nginx server block for polyglotformfill.mooo.com — mirrors the hospital-nexus
# static-serving pattern (SDD/scheduler-app/nginx.conf). Serves the two static
# pages. TLS is expected to be terminated in front (cert-manager/ingress, or a
# reverse proxy), exactly like the hospital-nexus SPAs. If you want this box to
# terminate TLS itself for a single static site, the Caddy installer
# (install-on-vm.sh) is simpler — it auto-issues the certificate.
server {
    listen 80;
    server_name polyglotformfill.mooo.com;

    root /usr/share/nginx/html/polyglotformfill;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location ~* \.(js|css|png|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # /privacy -> /privacy/index.html; unknown paths fall back to the landing page.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
