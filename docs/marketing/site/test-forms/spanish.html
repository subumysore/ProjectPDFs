<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Formulario de prueba (Español)</title>
<style>body{font:16px system-ui,sans-serif;max-width:560px;margin:32px auto;padding:0 18px;color:#101a20}h1{font-size:22px}label{display:block;margin:14px 0 4px;font-weight:600}input{width:100%;padding:8px 10px;border:1px solid #cbd5db;border-radius:8px;font-size:15px}.hint{color:#55666f;font-size:13px}</style></head>
<body><h1>Formulario de prueba — Español</h1>
<p class="hint">Prueba el autocompletado en otro idioma: abre la extensión y pulsa <b>Fill this page</b>. Debe detectar el español, traducir las etiquetas y rellenar tus datos.</p>
<form><label>Nombre</label><input name="nombre" autocomplete="off">
<label>Apellidos</label><input name="apellidos" autocomplete="off">
<label>Correo electrónico</label><input name="correo" autocomplete="off">
<label>Teléfono</label><input name="telefono" autocomplete="off">
<label>Dirección</label><input name="direccion" autocomplete="off">
<label>Ciudad</label><input name="ciudad" autocomplete="off">
<label>Estado / Provincia</label><input name="estado" autocomplete="off">
<label>Código postal</label><input name="cp" autocomplete="off">
<label>Fecha de nacimiento</label><input name="fnac" autocomplete="off"></form></body></html>
