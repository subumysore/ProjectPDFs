[package]
name = "core-store"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }

# NOTE: production enables encryption-at-rest by swapping to the
# `bundled-sqlcipher` feature (SQLCipher) + a key from the OS keystore (core-crypto).
