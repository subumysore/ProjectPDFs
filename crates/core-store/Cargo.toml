[package]
name = "core-store"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
core-crypto = { path = "../core-crypto" }

# NOTE: DataPoint values are AES-256-GCM sealed at rest (core-crypto). The DB
# itself can additionally move to SQLCipher (bundled-sqlcipher) later.
