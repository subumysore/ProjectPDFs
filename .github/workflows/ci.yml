# CI quality gates. Wire the TODO steps to your stack's real commands.
name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --- Governance gates (stack-agnostic, run today) ---
      - name: Traceability (BRD ↔ matrix)
        run: node scripts/check-traceability.mjs

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        # or: run trufflehog / your scanner of choice

      # --- Stack gates (Node + pnpm monorepo) ---
      - uses: pnpm/action-setup@v4
        with: { version: 9.12.0 }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      # --- Not yet wired (add when the tooling lands) ---
      # - run: pnpm lint            # add ESLint + per-package `lint` scripts first
      # - run: pnpm test:acceptance # features/*.feature via a BDD runner (e.g. cucumber)
      # - run: pnpm db:migrate:check # additive/reversible migration safety
      # - run: pnpm sbom            # generate SBOM on release
