<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { font: 13px system-ui, sans-serif; width: 320px; margin: 0; padding: 14px; color: #101a20; }
      h1 { font-size: 15px; margin: 0 0 2px; }
      .sub { color: #55666f; margin: 0 0 12px; font-size: 12px; }
      input { width: 100%; padding: 7px; box-sizing: border-box; margin-bottom: 8px; }
      button { padding: 6px 10px; margin-right: 6px; cursor: pointer; }
      .row { display: flex; gap: 6px; margin-bottom: 8px; }
      .msg { font-size: 12px; margin-top: 8px; min-height: 16px; }
      .ok { color: #0a6a60; }
      .err { color: #9a2c2c; }
      .hidden { display: none; }
      .keys { font-family: ui-monospace, monospace; font-size: 11px; color: #55666f; }
    </style>
  </head>
  <body>
    <h1>PolyglotFormFill Autofill</h1>
    <p class="sub">Encrypted on-device vault. Nothing leaves your device.</p>

    <div id="locked">
      <input id="pass" type="password" placeholder="Vault passphrase" />
      <div class="row">
        <button id="unlock">Unlock</button>
        <button id="unlockPasskey">Unlock with passkey</button>
      </div>
    </div>

    <div id="unlocked" class="hidden">
      <div class="row">
        <button id="fill">Fill this page</button>
        <button id="lock">Lock</button>
      </div>
      <div class="keys" id="keys"></div>
    </div>

    <div style="border-top: 1px solid #e5e5e5; margin: 10px 0 8px; padding-top: 8px">
      <button id="companionFill">Fill from native app (companion)</button>
      <div class="sub" style="margin-top: 6px">
        Uses the native app's vault over a local bridge — keys never enter the extension.
      </div>
    </div>

    <div class="msg" id="msg"></div>
    <script type="module" src="src/popup.js"></script>
  </body>
</html>
