<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Filled form · PolyglotFormFill</title>
<style>
  html, body { margin: 0; height: 100%; background: #525659; font-family: system-ui, sans-serif; }
  #bar { background: #0d8f83; color: #fff; padding: 10px 16px; font-size: 14px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
  #bar a { color: #fff; text-decoration: underline; }
  #main { display: flex; height: calc(100vh - 42px); }
  #stage { flex: 1; overflow: hidden; }
  #pdf { width: 100%; height: 100%; border: none; }
  #empty { color: #fff; padding: 40px; text-align: center; }
  #langpanel { width: 340px; background: #fff; color: #101a20; overflow: auto; border-left: 4px solid #0d8f83; padding: 16px; font-size: 14px; }
  #langpanel h3 { margin: 0 0 4px; font-size: 15px; }
  #langpanel .note { color: #55666f; font-size: 12.5px; margin-bottom: 12px; }
  #langpanel button { background: #0d8f83; color: #fff; border: none; border-radius: 8px; padding: 9px 12px; font-weight: 600; cursor: pointer; }
  #langpanel table { width: 100%; border-collapse: collapse; margin-top: 12px; }
  #langpanel td { padding: 6px 4px; border-bottom: 1px solid #eef2f3; vertical-align: top; }
  #langpanel td.orig { color: #55666f; } #langpanel td.tr { font-weight: 600; }
  #langpanel .st { color: #0a6a60; min-height: 16px; margin-top: 8px; font-size: 13px; }
</style>
</head>
<body>
  <div id="bar"><span>✓ Your filled form — PolyglotFormFill (on-device)</span><a id="dl" download="filled.pdf">Download PDF</a></div>
  <div id="main">
    <div id="stage"><iframe id="pdf" title="Filled PDF"></iframe></div>
    <aside id="langpanel" hidden>
      <h3 id="lpTitle">Read this form in your language</h3>
      <div class="note" id="lpNote"></div>
      <button id="lpGo">Translate the form's labels</button>
      <div class="st" id="lpStatus"></div>
      <table id="lpTable"></table>
    </aside>
  </div>
  <div id="empty" hidden>Nothing to show. Fill a PDF from the extension popup first.</div>
  <script type="module" src="src/viewer.js"></script>
</body>
</html>
