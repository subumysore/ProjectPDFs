<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Filled form · PolyglotFormFill</title>
<style>
  html, body { margin: 0; height: 100%; background: #525659; font-family: system-ui, sans-serif; }
  #bar { background: #0d8f83; color: #fff; padding: 10px 16px; font-size: 14px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
  #bar a { color: #fff; text-decoration: underline; }
  #main { display: flex; height: calc(100vh - 42px); }
  #stage { flex: 1; overflow: hidden; }
  #pdf { width: 100%; height: 100%; border: none; }
  #empty { color: #fff; padding: 40px; text-align: center; }
  #bar .actions { display: flex; gap: 14px; align-items: center; }
  #bar button.baraction { background: rgba(255,255,255,.16); color: #fff; border: 1px solid rgba(255,255,255,.5); border-radius: 6px; padding: 5px 12px; font-weight: 600; cursor: pointer; font-size: 13px; }
  #bar button.baraction:hover { background: rgba(255,255,255,.28); }
  #langpanel { width: 340px; min-width: 260px; max-width: 820px; flex: 0 0 auto; background: #fff; color: #101a20; overflow: auto; border-left: 4px solid #0d8f83; padding: 16px; font-size: 14px; position: relative; }
  #lpGrip { position: absolute; top: 0; left: -4px; width: 8px; height: 100%; cursor: col-resize; }
  #lpGrip:hover, #lpGrip.drag { background: rgba(13,143,131,.35); }
  #langpanel h3 { margin: 0 24px 4px 0; font-size: 15px; }
  #lpClose { position: absolute; top: 8px; right: 10px; border: none; background: none; color: #55666f; font-size: 18px; line-height: 1; cursor: pointer; padding: 2px 6px; border-radius: 6px; }
  #lpClose:hover { background: #eef2f3; color: #101a20; }
  #lpLangRow { display: flex; align-items: center; gap: 8px; margin: 10px 0; font-size: 13px; color: #55666f; }
  #lpLang { flex: 1; padding: 6px; border: 1px solid #cdd8d6; border-radius: 6px; font: inherit; }
  #langpanel .note { color: #55666f; font-size: 12.5px; margin-bottom: 12px; }
  #langpanel button { background: #0d8f83; color: #fff; border: none; border-radius: 8px; padding: 9px 12px; font-weight: 600; cursor: pointer; }
  #langpanel table { width: 100%; border-collapse: collapse; margin-top: 12px; }
  #langpanel th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: #8a99a0; padding: 4px; border-bottom: 2px solid #eef2f3; }
  #langpanel td { padding: 6px 4px; border-bottom: 1px solid #eef2f3; vertical-align: top; }
  #langpanel td.orig { color: #55666f; } #langpanel td.tr { font-weight: 600; }
  #langpanel td.origval { color: #55666f; } #langpanel td.val { color: #0a6a60; font-weight: 600; }
  #langpanel .st { color: #0a6a60; min-height: 16px; margin-top: 8px; font-size: 13px; }
</style>
</head>
<body>
  <div id="bar">
    <span id="barLabel">✓ Your filled form — PolyglotFormFill (on-device)</span>
    <div class="actions">
      <button id="panelToggle" class="baraction" hidden>🌐 Language panel</button>
      <button id="signViewer" class="baraction">✍️ Sign / handwrite</button>
      <button id="toggleOrig" class="baraction" hidden>Show original form</button>
      <a id="dl" download="filled.pdf">Download PDF</a>
      <button id="closeViewer" class="baraction" title="Close this view and go back to the original form">✕ Close</button>
    </div>
  </div>
  <div id="main">
    <div id="stage"><iframe id="pdf" title="Filled PDF"></iframe></div>
    <aside id="langpanel" hidden>
      <div id="lpGrip" title="Drag to resize"></div>
      <button id="lpClose" title="Close this panel" aria-label="Close">✕</button>
      <h3 id="lpTitle">Read this form in your language</h3>
      <div class="note" id="lpNote"></div>
      <label id="lpLangRow">Language:&nbsp;<select id="lpLang"></select></label>
      <button id="lpGo">Translate the form's labels &amp; values</button>
      <div class="st" id="lpStatus"></div>
      <table id="lpTable"></table>
    </aside>
  </div>
  <div id="empty" hidden>Nothing to show. Fill a PDF from the extension popup first.</div>
  <script type="module" src="src/viewer.js"></script>
</body>
</html>
