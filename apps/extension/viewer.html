<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Filled form · PolyglotFormFill</title>
<style>
  html, body { margin: 0; height: 100%; background: #525659; font-family: system-ui, sans-serif; }
  #bar { background: #0d8f83; color: #fff; padding: 10px 16px; font-size: 14px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
  #bar a { color: #fff; text-decoration: underline; }
  #stage { height: calc(100vh - 42px); overflow: auto; padding: 16px 0; }
  .pg { display: block; margin: 0 auto 16px; box-shadow: 0 6px 20px rgba(0,0,0,.4); background: #fff; max-width: 96%; }
  #empty { color: #fff; padding: 40px; text-align: center; }
</style>
</head>
<body>
  <div id="bar"><span>✓ Your filled form — PolyglotFormFill (on-device)</span><a id="dl" download="filled.pdf">Download PDF</a></div>
  <div id="stage"></div>
  <div id="empty" hidden>Nothing to show. Fill a PDF from the extension popup first.</div>
  <script type="module" src="src/viewer.js"></script>
</body>
</html>
