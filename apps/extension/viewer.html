<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Filled form · PolyglotFormFill</title>
<style>
  html, body { margin: 0; height: 100%; background: #525659; font-family: system-ui, sans-serif; }
  #bar { background: #0d8f83; color: #fff; padding: 9px 16px; font-size: 14px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
  #bar a { color: #fff; text-decoration: underline; }
  #f { width: 100%; height: calc(100vh - 40px); border: 0; }
  #empty { color: #fff; padding: 40px; text-align: center; }
</style>
</head>
<body>
  <div id="bar"><span>✓ Your filled form — PolyglotFormFill (on-device)</span><a id="dl" download="filled.pdf">Download</a></div>
  <iframe id="f"></iframe>
  <div id="empty" hidden>Nothing to show. Fill a PDF from the extension popup first.</div>
  <script src="src/viewer.js"></script>
</body>
</html>
