<!doctype html>
<html lang="en"><head><meta charset="utf-8"/>
<style>
  /* Animated CHAPTER divider between topics: ?title=Profile&sub=…&icon=👤 . Big word rises in behind
     a clip mask, an accent rule draws, an icon pops, soft form-bars drift in the background. */
  :root{ --bg:#0a5f57; --ink:#fff; --accent:#3fe0c5; }
  *{margin:0;box-sizing:border-box;font-family:"Segoe UI",system-ui,sans-serif;}
  html,body{width:100vw;height:100vh;overflow:hidden;background:var(--bg);color:var(--ink);}
  .stage{position:relative;width:100vw;height:100vh;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:2.2vh;}
  .bars{position:absolute;inset:0;overflow:hidden;opacity:.09;}
  .bar{position:absolute;height:2.6vh;border-radius:6px;background:#fff;transform:scaleX(0);transform-origin:left;}
  @keyframes fill{0%{transform:scaleX(.05);}55%{transform:scaleX(1);}100%{transform:scaleX(.05);}}
  .eye{position:relative;z-index:1;font-size:1.8vw;letter-spacing:.5vw;text-transform:uppercase;color:var(--accent);
    font-weight:700;opacity:0;transform:translateY(2vh);animation:appear .8s cubic-bezier(.19,1,.22,1) .15s forwards;}
  .icon{position:relative;z-index:1;font-size:8vw;opacity:0;transform:scale(.4);
    animation:pop .9s cubic-bezier(.2,1.3,.4,1) .1s forwards;}
  @keyframes pop{to{opacity:1;transform:scale(1);}}
  .title{position:relative;z-index:1;font-weight:800;font-size:8.5vw;line-height:1;letter-spacing:-1px;overflow:hidden;padding:.12em 0;}
  .title>span{display:inline-block;transform:translateY(115%);animation:rise 1s cubic-bezier(.19,1,.22,1) .3s forwards;}
  @keyframes rise{to{transform:translateY(0);}}
  @keyframes appear{to{opacity:1;transform:translateY(0);}}
  .rule{position:relative;z-index:1;height:.7vh;width:0;background:var(--accent);border-radius:3px;
    animation:draw .9s cubic-bezier(.19,1,.22,1) .7s forwards, glow 2.4s ease-in-out 1.6s infinite;}
  @keyframes draw{to{width:16vw;}}
  @keyframes glow{0%,100%{box-shadow:0 0 1.2vh var(--accent);}50%{box-shadow:0 0 3.4vh var(--accent);}}
  .sub{position:relative;z-index:1;font-size:2vw;color:#d7f5ef;opacity:0;
    animation:appear .9s cubic-bezier(.19,1,.22,1) 1s forwards;max-width:60vw;text-align:center;}
</style></head>
<body>
  <div class="stage">
    <div class="bars" id="bars"></div>
    <div class="icon" id="icon"></div>
    <div class="eye" id="eye"></div>
    <h1 class="title" id="title"></h1>
    <div class="rule"></div>
    <p class="sub" id="sub"></p>
  </div>
<script>
  const q=new URLSearchParams(location.search);
  document.getElementById("icon").textContent=q.get("icon")||"";
  document.getElementById("eye").textContent=q.get("eye")||"";
  const t=document.getElementById("title"); const s=document.createElement("span");
  s.textContent=q.get("title")||""; t.appendChild(s);
  document.getElementById("sub").textContent=q.get("sub")||"";
  let seed=5;const rnd=()=>(seed=(seed*1103515245+12345)&0x7fffffff)/0x7fffffff;
  const bars=document.getElementById("bars");
  for(let i=0;i<9;i++){const b=document.createElement("div");b.className="bar";
    b.style.top=(8+i*10)+"vh";b.style.left=(i%2?52:8)+"vw";b.style.width=(16+(i*3)%24)+"vw";
    b.style.animation=`fill ${3.2+(i%4)*0.6}s cubic-bezier(.4,0,.2,1) ${(-rnd()*3).toFixed(2)}s infinite alternate`;
    bars.appendChild(b);}
</script>
</body></html>
