<!doctype html>
<html lang="en"><head><meta charset="utf-8"/>
<style>
  /* Chrome Web Store MARQUEE promo tile — 1400x560. */
  :root{ --teal:#0d8f83; --teal2:#0a5f57; --accent:#3fe0c5; --ink:#16233a; }
  *{margin:0;box-sizing:border-box;font-family:"Segoe UI",system-ui,sans-serif;}
  html,body{width:1400px;height:560px;overflow:hidden;}
  .tile{position:relative;width:1400px;height:560px;background:linear-gradient(140deg,#0d8f83 0%,#0a5f57 100%);
    color:#fff;display:flex;align-items:center;padding:0 80px;gap:70px;overflow:hidden;}
  .bars{position:absolute;inset:0;opacity:.09;}
  .bar{position:absolute;height:14px;border-radius:6px;background:#fff;}
  .left{position:relative;flex:1;}
  .name{display:flex;align-items:center;gap:18px;font-size:34px;font-weight:800;margin-bottom:20px;}
  .mark{width:60px;height:60px;border-radius:15px;background:#fff;position:relative;}
  .mark .l{position:absolute;left:14%;height:7px;border-radius:99px;background:#cfe9e4;}
  .mark .l1{top:30%;width:56%;} .mark .l2{top:48%;width:66%;} .mark .l3{top:66%;width:44%;background:var(--teal);}
  .h1{font-size:58px;font-weight:800;line-height:1.05;letter-spacing:-1px;}
  .h1 .a{color:var(--accent);}
  .sub{font-size:24px;opacity:.92;margin-top:22px;max-width:640px;line-height:1.4;}
  .pills{display:flex;gap:14px;margin-top:30px;}
  .pill{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);border-radius:99px;padding:9px 20px;font-size:18px;font-weight:600;}
  /* right: a mini form card with a check */
  .card{position:relative;width:420px;height:380px;background:#fff;border-radius:18px;box-shadow:0 30px 60px rgba(0,0,0,.35);padding:34px 32px;}
  .fh{height:44px;background:var(--teal);border-radius:9px;width:62%;margin-bottom:26px;}
  .row{margin-bottom:22px;} .lbl{height:11px;width:38%;background:#dfe8ec;border-radius:99px;margin-bottom:10px;}
  .val{height:40px;border:1.5px solid var(--teal);border-radius:9px;background:#eaf7f4;}
  .card .chk{position:absolute;right:-22px;bottom:-22px;width:88px;height:88px;border-radius:50%;background:var(--accent);
    display:flex;align-items:center;justify-content:center;box-shadow:0 16px 34px rgba(0,0,0,.3);}
  .card .chk svg{width:52%;height:52%;}
</style></head>
<body>
  <div class="tile">
    <div class="bars" id="bars"></div>
    <div class="left">
      <div class="name"><span class="mark"><span class="l l1"></span><span class="l l2"></span><span class="l l3"></span></span> PolyglotFormFill</div>
      <div class="h1">Read &amp; write any form —<br><span class="a">in any language.</span></div>
      <div class="sub">Fill PDFs, Word, Excel &amp; web forms from your own encrypted vault. We never see your data.</div>
      <div class="pills"><span class="pill">🔒 On-device</span><span class="pill">🌐 26 languages</span><span class="pill">🚫 Zero telemetry</span></div>
    </div>
    <div class="card">
      <div class="fh"></div>
      <div class="row"><div class="lbl"></div><div class="val"></div></div>
      <div class="row"><div class="lbl"></div><div class="val"></div></div>
      <div class="row"><div class="lbl"></div><div class="val"></div></div>
      <div class="chk"><svg viewBox="0 0 24 24"><path fill="none" stroke="#0a5f57" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg></div>
    </div>
  </div>
<script>
  let s=11;const rnd=()=>(s=(s*1103515245+12345)&0x7fffffff)/0x7fffffff;const b=document.getElementById("bars");
  for(let i=0;i<9;i++){const d=document.createElement("div");d.className="bar";d.style.top=(30+i*62)+"px";
    d.style.left=(rnd()*120)+"px";d.style.width=(260+rnd()*520)+"px";b.appendChild(d);}
</script>
</body></html>
