<!doctype html>
<html lang="en"><head><meta charset="utf-8"/>
<style>
  /* Chrome Web Store SMALL promo tile — 440x280. Teal brand, logo mark, tagline. */
  :root{ --teal:#0d8f83; --teal2:#0a5f57; --accent:#3fe0c5; }
  *{margin:0;box-sizing:border-box;font-family:"Segoe UI",system-ui,sans-serif;}
  html,body{width:440px;height:280px;overflow:hidden;}
  .tile{position:relative;width:440px;height:280px;background:linear-gradient(140deg,#0d8f83 0%,#0a5f57 100%);
    color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;overflow:hidden;}
  .bars{position:absolute;inset:0;opacity:.10;}
  .bar{position:absolute;height:9px;border-radius:4px;background:#fff;}
  .mark{width:66px;height:66px;border-radius:16px;background:#fff;position:relative;box-shadow:0 8px 18px rgba(0,0,0,.25);}
  .mark .l{position:absolute;left:14%;height:8px;border-radius:99px;background:#cfe9e4;}
  .mark .l1{top:30%;width:56%;} .mark .l2{top:48%;width:66%;} .mark .l3{top:66%;width:44%;background:var(--teal);}
  .mark .chk{position:absolute;right:-8px;bottom:-8px;width:30px;height:30px;border-radius:50%;background:var(--accent);
    display:flex;align-items:center;justify-content:center;}
  .mark .chk svg{width:56%;height:56%;}
  .name{font-size:27px;font-weight:800;letter-spacing:-.3px;position:relative;}
  .tag{font-size:14.5px;opacity:.92;text-align:center;line-height:1.35;position:relative;max-width:360px;}
  .tag b{color:var(--accent);font-weight:700;}
</style></head>
<body>
  <div class="tile">
    <div class="bars" id="bars"></div>
    <div class="mark"><div class="l l1"></div><div class="l l2"></div><div class="l l3"></div>
      <div class="chk"><svg viewBox="0 0 24 24"><path fill="none" stroke="#0a5f57" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg></div>
    </div>
    <div class="name">PolyglotFormFill</div>
    <div class="tag">Read &amp; write any form — in <b>any language</b>.<br>On your device. Nothing leaves.</div>
  </div>
<script>
  let s=7;const rnd=()=>(s=(s*1103515245+12345)&0x7fffffff)/0x7fffffff;const b=document.getElementById("bars");
  for(let i=0;i<7;i++){const d=document.createElement("div");d.className="bar";d.style.top=(20+i*36)+"px";
    d.style.left=(rnd()*40)+"px";d.style.width=(120+rnd()*240)+"px";b.appendChild(d);}
</script>
</body></html>
