<!doctype html>
<html lang="en"><head><meta charset="utf-8"/>
<style>
  /* Realistic US-passport DATA PAGE — our own artwork (no stock/real document), OCR-readable labels
     so on-device extraction works, and an illustrated (non-photo) portrait for privacy. */
  *{margin:0;box-sizing:border-box;font-family:"Arial","Segoe UI",sans-serif;}
  html,body{width:1040px;height:720px;overflow:hidden;background:#fff;}
  /* plain, LIGHT background — no guilloché pattern (that adds OCR noise and garbles extraction) */
  .page{position:relative;width:1040px;height:720px;background:#f4f7fb;border:2px solid #b9c6d6;padding:0;}
  .band{height:78px;background:linear-gradient(180deg,#1c3a63,#16305a);color:#fff;display:flex;
    align-items:center;justify-content:space-between;padding:0 30px;}
  .band .t{font-size:24px;font-weight:800;letter-spacing:2px;}
  .band .u{font-size:16px;opacity:.9;letter-spacing:1px;}
  .band .eagle{font-size:30px;}
  .sub{padding:8px 30px 0;font-size:15px;color:#3a5573;font-weight:700;letter-spacing:1px;}
  .body{display:flex;gap:28px;padding:14px 30px 0;}
  .photo{width:220px;height:288px;border:1px solid #9fb2c6;border-radius:3px;overflow:hidden;background:#dfe8f0;position:relative;}
  .photo img{width:100%;height:100%;object-fit:cover;display:block;}
  .ghost{position:absolute;right:8px;bottom:8px;width:66px;height:86px;border:1px solid #9fb2c6;opacity:.5;overflow:hidden;background:#dfe8f0;}
  .ghost img{width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.1);}
  /* SINGLE column; each field is ONE inline "Label: value" run (like the DL front, which OCR reads
     cleanly). No column alignment — that made OCR read a column of labels then a column of values. */
  .fields{flex:1;display:flex;flex-direction:column;gap:9px;padding-top:2px;}
  .f{font-size:20px;color:#16233a;line-height:1.15;}
  .f b{color:#5a748f;font-weight:700;font-size:16px;}
  .mrz{position:absolute;left:0;right:0;bottom:0;height:96px;background:#f4f7fb;border-top:1px solid #c3d0de;
    display:flex;flex-direction:column;justify-content:center;padding:0 30px;font-family:"OCR B","Courier New",monospace;
    font-size:26px;letter-spacing:4px;color:#16233a;line-height:1.45;}
</style></head>
<body>
  <div class="page">
    <div class="band">
      <div><div class="t">PASSPORT</div><div class="u">UNITED STATES OF AMERICA</div></div>
      <div class="eagle">🦅</div>
    </div>
    <div class="body">
      <div class="photo">
        <img src="/docs/portrait.png" alt="illustrated portrait"/>
        <div class="ghost"><img src="/docs/portrait.png" alt=""/></div>
      </div>
      <div class="fields">
        <div class="f"><b>Passport No:</b> X1234567</div>
        <div class="f"><b>Surname:</b> DOE</div>
        <div class="f"><b>Given names:</b> JOHN QUINCY</div>
        <div class="f"><b>Nationality:</b> USA</div>
        <div class="f"><b>Sex:</b> M</div>
        <div class="f"><b>Date of birth:</b> 04/12/1988</div>
        <div class="f"><b>Expiry date:</b> 03/28/2032</div>
      </div>
    </div>
    <div class="mrz">
      <div>P&lt;USADOE&lt;&lt;JOHN&lt;QUINCY&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;</div>
      <div>X1234567&lt;9USA8804127M3203281&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;06</div>
    </div>
  </div>
</body></html>
