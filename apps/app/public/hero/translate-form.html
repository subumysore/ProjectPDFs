<!doctype html>
<html lang="en"><head><meta charset="utf-8"/>
<style>
  /* v2-12 languages: the SAME form, its labels re-rendering through many languages (read any form in
     YOUR language), while the values stay. A language badge names the current one. Smooth crossfades. */
  :root{ --teal:#0d8f83; --teal2:#0a5f57; --accent:#3fe0c5; --ink:#16233a; }
  *{margin:0;box-sizing:border-box;font-family:"Segoe UI","Noto Sans","Noto Sans Devanagari","Noto Sans Arabic","Noto Sans CJK SC",system-ui,sans-serif;}
  html,body{width:100vw;height:100vh;overflow:hidden;background:#0e3b36;display:flex;align-items:center;justify-content:center;}
  .wrap{position:relative;width:64vw;}
  .badge{position:absolute;top:-8vh;left:0;display:flex;align-items:center;gap:1vw;color:#eafbf8;font-size:2vw;font-weight:700;}
  .badge .globe{font-size:2.4vw;}
  .badge .lang{color:var(--accent);transition:opacity .35s;}
  .form{background:#fff;border-radius:1.4vh;box-shadow:0 4vh 9vh rgba(0,0,0,.45);padding:4vh 3vw;}
  .hh{height:5.2vh;background:var(--teal);border-radius:.8vh;width:64%;display:flex;align-items:center;
    padding:0 1.4vw;color:#fff;font-weight:700;font-size:1.7vw;margin-bottom:3.4vh;transition:opacity .35s;}
  .row{display:flex;gap:2vw;margin-bottom:3vh;}
  .fld{flex:1;}
  .lbl{font-size:1.35vw;color:#5a6b78;font-weight:600;margin-bottom:1vh;transition:opacity .35s;min-height:1.6vw;}
  .val{height:5.4vh;border:1.5px solid var(--teal);border-radius:.8vh;background:#eaf7f4;display:flex;align-items:center;
    padding:0 1.2vw;font-size:1.5vw;color:var(--ink);}
  [dir="rtl"] .hh{flex-direction:row-reverse;} [dir="rtl"] .val{flex-direction:row-reverse;text-align:right;}
</style></head>
<body>
  <div class="wrap" id="wrap">
    <div class="badge"><span class="globe">🌐</span><span>Shown in&nbsp;</span><span class="lang" id="lang">English</span></div>
    <div class="form" id="form">
      <div class="hh" id="hh">Application form</div>
      <div class="row">
        <div class="fld"><div class="lbl" id="l0">Full name</div><div class="val">John Q. Doe</div></div>
        <div class="fld"><div class="lbl" id="l1">Date of birth</div><div class="val">04 / 12 / 1988</div></div>
      </div>
      <div class="row">
        <div class="fld"><div class="lbl" id="l2">Home address</div><div class="val">100 Sample Ave, Demo City</div></div>
        <div class="fld"><div class="lbl" id="l3">Nationality</div><div class="val">American</div></div>
      </div>
    </div>
  </div>
<script>
  // [language name, dir, header, [full name, date of birth, home address, nationality]]
  const L=[
    ["English","ltr","Application form",["Full name","Date of birth","Home address","Nationality"]],
    ["हिन्दी","ltr","आवेदन पत्र",["पूरा नाम","जन्म तिथि","घर का पता","राष्ट्रीयता"]],
    ["العربية","rtl","استمارة الطلب",["الاسم الكامل","تاريخ الميلاد","عنوان المنزل","الجنسية"]],
    ["中文","ltr","申请表",["全名","出生日期","家庭住址","国籍"]],
    ["Español","ltr","Formulario de solicitud",["Nombre completo","Fecha de nacimiento","Dirección","Nacionalidad"]],
    ["日本語","ltr","申請フォーム",["氏名","生年月日","自宅住所","国籍"]],
    ["Kiswahili","ltr","Fomu ya maombi",["Jina kamili","Tarehe ya kuzaliwa","Anwani ya nyumbani","Utaifa"]],
  ];
  const lang=document.getElementById("lang"), hh=document.getElementById("hh"), wrap=document.getElementById("wrap");
  const ls=[0,1,2,3].map(i=>document.getElementById("l"+i));
  let i=0;
  function show(k){
    const [name,dir,head,labels]=L[k];
    // fade out
    [lang,hh,...ls].forEach(e=>e.style.opacity=0);
    setTimeout(()=>{
      wrap.setAttribute("dir",dir);
      lang.textContent=name; hh.textContent=head; labels.forEach((t,n)=>ls[n].textContent=t);
      [lang,hh,...ls].forEach(e=>e.style.opacity=1);
    },360);
  }
  show(0);
  setInterval(()=>{ i=(i+1)%L.length; show(i); }, 2000);
</script>
</body></html>
