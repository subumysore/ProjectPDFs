<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Candidate Application — Northwind Technologies</title>
<style>
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Segoe UI",system-ui,sans-serif; background:#eef2f5; color:#1a2733; }
  .top { background:#12303f; color:#fff; padding:22px 0; }
  .wrap { max-width:820px; margin:0 auto; padding:0 28px; }
  .top h1 { margin:0; font-size:24px; font-weight:700; }
  .top p { margin:4px 0 0; opacity:.8; font-size:14px; }
  .card { background:#fff; margin:28px auto; max-width:820px; border-radius:12px;
    box-shadow:0 6px 26px rgba(20,40,60,.08); padding:36px 40px 44px; }
  h2 { font-size:16px; letter-spacing:.4px; text-transform:uppercase; color:#12303f; margin:0 0 20px; }
  .row { display:flex; gap:22px; }
  .field { flex:1; margin-bottom:22px; }
  label { display:block; font-size:13px; font-weight:600; color:#3a4a58; margin-bottom:7px; }
  label .req { color:#c0392b; }
  input, select { width:100%; height:44px; padding:0 13px; font-size:15px; color:#1a2733;
    border:1px solid #cdd6dd; border-radius:8px; background:#fff; }
  input:focus, select:focus { outline:none; border-color:#1c7c6f; box-shadow:0 0 0 3px rgba(28,124,111,.15); }
  .btn { margin-top:10px; background:#1c7c6f; color:#fff; border:0; height:50px; padding:0 34px;
    font-size:16px; font-weight:600; border-radius:8px; cursor:pointer; }
</style>
</head>
<body>
  <div class="top"><div class="wrap"><h1>Northwind Technologies</h1><p>Candidate Application — Senior Engineer</p></div></div>
  <form class="card" onsubmit="return false">
    <h2>Your details</h2>
    <div class="row">
      <div class="field"><label>First name <span class="req">*</span></label><input name="first_name" autocomplete="given-name"></div>
      <div class="field"><label>Last name <span class="req">*</span></label><input name="last_name" autocomplete="family-name"></div>
    </div>
    <div class="row">
      <div class="field"><label>Email <span class="req">*</span></label><input type="email" name="email" autocomplete="email"></div>
      <div class="field"><label>Phone</label><input name="phone" autocomplete="tel"></div>
    </div>
    <div class="field"><label>Street address</label><input name="address" autocomplete="street-address"></div>
    <div class="row">
      <div class="field"><label>Occupation</label><input name="occupation"></div>
      <div class="field"><label>Nationality</label><input name="nationality"></div>
    </div>
    <div class="row">
      <div class="field"><label>Gender</label>
        <select name="gender"><option value="">Select…</option><option>Male</option><option>Female</option></select></div>
      <div class="field"><label>Marital status</label>
        <select name="marital_status"><option value="">Select…</option><option>Single</option><option>Married</option></select></div>
    </div>
    <button class="btn">Submit application</button>
  </form>
</body>
</html>
