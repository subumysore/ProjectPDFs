[package]
name = "app"
version = "1.0.11"
edition = "2021"
publish = false

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# OS secure keystore for the vault key (Windows Credential Manager here; add
# apple-native / sync-secret-service features per-platform later).
keyring = { version = "3", features = ["windows-native"] }
open = "5"

# Native core modules (workspace crates)
core-store = { path = "../../../crates/core-store" }
core-crypto = { path = "../../../crates/core-crypto" }
core-catalog = { path = "../../../crates/core-catalog" }
core-fetch = { path = "../../../crates/core-fetch" }
core-license = { path = "../../../crates/core-license" }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
