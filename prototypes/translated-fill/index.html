<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ProjectPDFs — Translated-Fill Spike</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { margin: 0; display: grid; grid-template-columns: 320px 1fr; height: 100vh; }
      #sidebar { padding: 16px; border-right: 1px solid #8884; overflow: auto; }
      #stage { position: relative; overflow: auto; padding: 16px; background: #6661; }
      #canvasWrap { position: relative; width: max-content; box-shadow: 0 2px 12px #0004; }
      canvas { display: block; }
      .field { position: absolute; box-sizing: border-box; }
      .field input {
        width: 100%; height: 100%; box-sizing: border-box; border: 2px solid #2a7ae2;
        background: #fffd; font-size: 13px; padding: 0 4px;
      }
      .field label {
        position: absolute; top: -16px; left: 0; font-size: 10px; white-space: nowrap;
        background: #2a7ae2; color: #fff; padding: 0 4px; border-radius: 3px; max-width: 300px;
        overflow: hidden; text-overflow: ellipsis;
      }
      h1 { font-size: 15px; } h2 { font-size: 12px; text-transform: uppercase; opacity: .6; margin: 16px 0 4px; }
      label.row { display: block; margin: 6px 0; font-size: 13px; }
      button { width: 100%; padding: 8px; margin: 4px 0; cursor: pointer; }
      select, input[type=text] { width: 100%; padding: 6px; box-sizing: border-box; }
      #log { font-size: 11px; white-space: pre-wrap; opacity: .8; margin-top: 12px; max-height: 200px; overflow: auto; }
      .muted { opacity: .6; font-size: 11px; }
    </style>
  </head>
  <body>
    <aside id="sidebar">
      <h1>Translated-Fill Spike</h1>
      <p class="muted">De-risks ProjectPDFs req #3. Scanned PDF → OCR → translate labels → fill → export.</p>

      <h2>1. Load a PDF</h2>
      <input type="file" id="file" accept="application/pdf" />
      <button id="sampleBtn">Generate sample Japanese form</button>

      <h2>2. Languages</h2>
      <label class="row">Source (form) language
        <select id="srcLang"><option value="jpn|ja">Japanese</option><option value="deu|de">German</option><option value="fra|fr">French</option><option value="spa|es">Spanish</option></select>
      </label>
      <label class="row">Your language
        <select id="userLang"><option value="en">English</option><option value="hi">Hindi</option><option value="fr">French</option><option value="es">Spanish</option></select>
      </label>

      <h2>3. Detect &amp; translate</h2>
      <button id="processBtn" disabled>Run OCR + detect fields + translate</button>

      <h2>4. Export</h2>
      <label class="row">Write values in
        <select id="outLang"><option value="user">My language (as typed)</option><option value="source">Original form language</option></select>
      </label>
      <button id="exportBtn" disabled>Fill &amp; download PDF</button>

      <h2>Translation provider</h2>
      <label class="row">Google/DeepL API key (optional)
        <input type="text" id="apiKey" placeholder="blank = free MyMemory API" />
      </label>

      <div id="log"></div>
    </aside>
    <main id="stage">
      <div id="canvasWrap"></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
